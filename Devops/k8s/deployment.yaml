apiVersion: apps/v1
kind: Deployment

metadata:
  name: devsecops-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devsecops-demo

  template:
    metadata:
      labels:
        app: devsecops-demo

    spec:
      containers:
        - name: devsecops-demo
          image: anaha2211/devsecops-demo:build-21
          ports:
            - containerPort: 8081
